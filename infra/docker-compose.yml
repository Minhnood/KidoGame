# Docker Compose cho production (M5). Chạy từ trong thư mục infra/.
#
#   cp .env.example .env   # rồi sửa mật khẩu và domain
#   docker compose up -d --build
#   docker compose run --rm web pnpm --filter @kidogame/web db:deploy
#
# `db:deploy` chứ KHÔNG phải `db:push`: chỉ khác ở `--skip-generate`. Prisma client
# đã được sinh lúc build image; `prisma generate` chạy lại trong container sẽ cố ghi
# vào /app/node_modules do root sở hữu, trong khi tiến trình chạy bằng user `node` —
# kết quả là một lỗi EACCES to đùng ngay giữa bước migrate. Nó KHÔNG làm hỏng gì
# (schema đã push xong, constraints vẫn chạy tiếp), nhưng một bước deploy bình thường
# mà in ra lỗi quyền là thứ khiến người ta hoặc hoảng, hoặc quen mắt rồi bỏ qua cả
# những lỗi thật sau này.
#
# SÁU SERVICE: db, web, caddy, backup, prune, umami. KHÔNG có service nào chạy
# player-server.mjs — file đó chỉ dùng khi dev trên máy local. Ở production chính
# Caddy serve thư mục storage, đúng như infra/Caddyfile đã viết sẵn từ M0.
#
# HAI DOMAIN là yêu cầu bảo mật, không phải sở thích. Cookie phiên là host-only
# trên app domain nên không lọt sang player domain — nhờ vậy một game độc hại
# do người lạ upload không đọc được session của đứa trẻ đang đăng nhập. Cookie
# KHÔNG phân biệt theo port, nên "hai port" không thay thế được "hai hostname".
#
# Domain khai MỘT LẦN trong .env: cả Caddy và app đều đọc từ đó. Đừng sửa
# domain trực tiếp trong Caddyfile — lệch giữa hai chỗ thì frame-ancestors
# không khớp app origin, iframe bị chặn, và triệu chứng là "game không boot"
# hay "stage 0x0", nhìn y hệt lỗi đóng gói. Đây là cái bẫy đã vấp ở dev.

name: kidogame

# ---------------------------------------------------------------------------
# GIỚI HẠN LOG, áp cho cả năm service qua YAML anchor.
#
# Docker mặc định dùng driver `json-file` KHÔNG GIỚI HẠN: file log lớn mãi tới khi
# container bị xoá. Trên một VPS nhỏ đó là một cách hết đĩa rất chậm và rất im —
# và khi đĩa đầy thì Postgres là thứ chết trước, tức mất web chứ không phải mất log.
#
# 20MB × 5 file = tối đa 100MB mỗi service. Đủ để soi lại vài ngày gần nhất, mà
# vẫn có trần. Đây là log DUY NHẤT của hệ thống này — chưa có nơi nào khác nhận
# lỗi, xem `infra/GIAM-SAT.md`.
# ---------------------------------------------------------------------------
x-logging: &logging
  driver: json-file
  options:
    max-size: '20m'
    max-file: '5'

services:
  # ---------------------------------------------------------------------------
  # Postgres. Không publish port ra ngoài: chỉ `web` trong network nội bộ nói
  # chuyện với nó. Muốn vào bằng psql thì `docker compose exec db psql -U kidogame`.
  # ---------------------------------------------------------------------------
  db:
    image: postgres:17
    restart: unless-stopped
    logging: *logging
    environment:
      POSTGRES_DB: kidogame
      POSTGRES_USER: kidogame
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?thieu POSTGRES_PASSWORD trong infra/.env}
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      # `web` chờ cái này xanh mới khởi động, khỏi crash vòng đầu vì DB chưa lên.
      test: ['CMD-SHELL', 'pg_isready -U kidogame -d kidogame']
      interval: 10s
      timeout: 5s
      retries: 12

  # ---------------------------------------------------------------------------
  # App Next.js. Cũng không publish port: Caddy là đường vào duy nhất.
  # ---------------------------------------------------------------------------
  web:
    build:
      context: ..
      dockerfile: infra/Dockerfile
    restart: unless-stopped
    logging: *logging
    depends_on:
      db:
        condition: service_healthy
    environment:
      # Mật khẩu đi vào URL nên chỉ dùng ký tự chữ và số — ký tự như @ : / ?
      # phải percent-encode, và quên encode thì lỗi báo ra là "không kết nối
      # được DB", không hề chỉ vào mật khẩu.
      DATABASE_URL: postgresql://kidogame:${POSTGRES_PASSWORD}@db:5432/kidogame?schema=public
      # Dùng để dựng link tuyệt đối trong email xác minh / đặt lại mật khẩu.
      APP_ORIGIN: https://${APP_DOMAIN:?thieu APP_DOMAIN trong infra/.env}
      # Vào cả CSP frame-src của app (next.config.ts) và URL file game.
      PLAYER_ORIGIN: https://${PLAYER_DOMAIN:?thieu PLAYER_DOMAIN trong infra/.env}
      # Origin thứ ba: khu quản trị. RỖNG = chưa tách, /admin nằm trên app domain
      # như trước. Có giá trị = middleware chỉ phục vụ /admin* trên host này, và
      # trả 404 cho /admin* trên app domain. Không dùng `:?` vì tách là tuỳ chọn.
      ADMIN_ORIGIN: ${ADMIN_DOMAIN:+https://${ADMIN_DOMAIN}}
      # Hai đường gửi mail, phải có MỘT. Không đường nào thì `sendMail` NÉM LỖI ở
      # production, cố ý — in mail chứa token ra log production chính là rò token.
      # Xem src/lib/mail.ts.
      #
      # KHÔNG dùng `:?` cho biến nào trong nhóm này, dù trước đây RESEND_API_KEY có.
      # Lý do: compose không diễn đạt được "một trong hai", nên `:?` trên một đường
      # sẽ chặn cả stack không khởi động được đối với người đã cấu hình xong đường
      # kia. Đổi lại, cấu hình thiếu không còn lộ ra lúc `up` mà lúc gửi lá thư đầu
      # tiên — nên chạy `node infra/mail-check.mjs` trước khi mở web, đó là chỗ trả
      # lời có/không cho cả hai đường.
      SMTP_HOST: ${SMTP_HOST:-}
      SMTP_PORT: ${SMTP_PORT:-587}
      SMTP_USER: ${SMTP_USER:-}
      SMTP_PASS: ${SMTP_PASS:-}
      SMTP_SECURE: ${SMTP_SECURE:-}
      RESEND_API_KEY: ${RESEND_API_KEY:-}
      MAIL_FROM: ${MAIL_FROM:-KidoGame <no-reply@kidogame.vn>}
      # Hiện trên /dieu-khoan và nhận mail yêu cầu gỡ bản quyền. KHÔNG dùng `:?`
      # như hai biến trên: thiếu tên đơn vị vận hành chỉ làm trang điều khoản kém
      # đầy đủ, còn `:?` sẽ chặn cả stack không khởi động được vì một dòng chữ.
      OPERATOR_NAME: ${OPERATOR_NAME:-}
      OPERATOR_EMAIL: ${OPERATOR_EMAIL:-}
      # Mã website trong Umami. RỖNG = không chèn thẻ script đếm lượt xem nào — web
      # chạy y như trước khi có Umami. Lấy mã ở dashboard sau khi tạo website.
      UMAMI_WEBSITE_ID: ${UMAMI_WEBSITE_ID:-}
      # Cùng lý do như hai service backup và prune, nhưng hệ quả ở đây là thứ NGƯỜI
      # DÙNG đọc: mọi ngày tháng của app đều do container này định dạng. Không có
      # dòng này thì nó chạy UTC, và mốc nào rơi sau 17:00 giờ ta bị in lùi một ngày
      # — kể cả hạn "sau ngày này thì file gốc của bé mất hẳn" trong thư báo gỡ game
      # và trong khu quản trị. Lệch một ngày ở đó không phải chuyện hiển thị.
      TZ: ${TZ:-Asia/Ho_Chi_Minh}
    volumes:
      # Ghi được: đây là tiến trình nhận upload và đóng gói game.
      - storage:/srv/storage
    healthcheck:
      # Trang chủ có truy vấn DB nên phép kiểm này cũng bắt được cả DB chết.
      # Fetch trượt hoặc trả không-2xx -> promise reject -> node thoát khác 0.
      test: ['CMD', 'node', '-e', "fetch('http://127.0.0.1:3000/').then(r => { if (!r.ok) throw new Error(String(r.status)) })"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s

  # ---------------------------------------------------------------------------
  # Caddy: TLS tự động, reverse proxy cho app, và serve tĩnh cho player origin.
  # ---------------------------------------------------------------------------
  caddy:
    image: caddy:2
    restart: unless-stopped
    logging: *logging
    depends_on:
      - web
    ports:
      # Cần 80 mở thật ra Internet: Let's Encrypt xác thực qua đó.
      - '80:80'
      - '443:443'
      - '443:443/udp' # HTTP/3
    environment:
      # Lặp lại `:?` của service `web` chứ không viết `${APP_DOMAIN}` trần, dù rỗng ở
      # đây đã bị chặn từ trên: mọi biến làm TÊN SITE phải tự đỡ lấy mình. Rỗng ở
      # dòng này là Caddy từ chối cả file — xem ghi chú dài ở ADMIN_DOMAIN bên dưới —
      # nên để nó dựa vào một `:?` nằm ở service khác là đặt cược rằng không ai gỡ
      # `:?` đó. Cược đó đã thua một lần: cả nhóm mail từng có `:?` và đã bị bỏ.
      APP_DOMAIN: ${APP_DOMAIN:?thieu APP_DOMAIN trong infra/.env}
      PLAYER_DOMAIN: ${PLAYER_DOMAIN:?thieu PLAYER_DOMAIN trong infra/.env}
      # KHÔNG truyền rỗng xuống Caddy, dù `.env.example` mời để trống biến này.
      #
      # `Caddyfile` viết `{$ADMIN_DOMAIN:admin.kidogame.vn}`, mà mặc định sau dấu `:`
      # chỉ áp dụng khi biến CHƯA ĐƯỢC ĐẶT. Truyền `${ADMIN_DOMAIN:-}` là ĐẶT THÀNH
      # RỖNG — khác hẳn — nên ra một khối site không có tên và Caddy TỪ CHỐI CẢ FILE,
      # kéo sập luôn app và player. Lỗi in ra là `server block without any key is
      # global configuration` và không hề nhắc tới `ADMIN_DOMAIN`; compose vẫn xanh,
      # bốn service kia vẫn healthy, chỉ mình caddy crash loop và dòng ACME nhìn y
      # như DNS chưa trỏ. Đã mất hàng giờ ở đây một lần.
      #
      # Mặc định là `.localhost` chứ không phải tên thật: Caddy coi `.localhost` là
      # nội bộ nên tự cấp chứng chỉ bằng CA riêng (`issuer:"local"`, ~200ms) — không
      # ACME thất bại lặp lại, không đốt hạn mức Let's Encrypt, và không DNS công
      # cộng nào trỏ tới nên không ai ngoài Internet vào được. Đúng bằng ý định đã
      # ghi trong `Caddyfile`: để trống là TẮT khu quản trị tách riêng.
      #
      # Service `web` ở trên vẫn đọc `${ADMIN_DOMAIN:+...}` từ .env, nên nó vẫn thấy
      # ADMIN_ORIGIN RỖNG và giữ `/admin` trên app domain. Đừng "dọn cho gọn" bằng
      # cách đặt mặc định này vào `.env.example` — làm thế là bật tách origin sau
      # lưng người deploy, và triệu chứng khi đó là `/admin` trả 404 trên app domain.
      ADMIN_DOMAIN: ${ADMIN_DOMAIN:-admin.localhost}
      # Dashboard Umami. Cùng lý do với ADMIN_DOMAIN ngay trên: rỗng mà truyền thẳng
      # xuống thì Caddy ra một khối site không tên và từ chối CẢ FILE, nên mặc định
      # phải là một tên vô hại chứ không phải chuỗi rỗng.
      STATS_DOMAIN: ${STATS_DOMAIN:-stats.localhost}
      ADMIN_EMAIL: ${ADMIN_EMAIL:-admin@kidogame.vn}
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      # CHỈ ĐỌC. Player origin không bao giờ được ghi vào storage — nó chỉ là
      # nơi phát file, và mọi thứ nó phát ra là do `web` đã kiểm và đóng gói.
      - storage:/srv/storage:ro
      # Giữ chứng chỉ đã cấp. Mất volume này là mỗi lần dựng lại phải xin
      # chứng chỉ mới, rất dễ chạm rate limit của Let's Encrypt.
      - caddy_data:/data
      - caddy_config:/config

  # ---------------------------------------------------------------------------
  # Sao lưu hằng ngày: dump Postgres + đóng gói storage, giữ N bản gần nhất.
  #
  # Là một service trong stack chứ không phải cron trên host, cố ý: cron trên host
  # là một bước cài đặt riêng, nằm ngoài repo, và là thứ người ta quên. Backup mà
  # quên bật thì đúng bằng không có backup, nhưng lại cho cảm giác đã có.
  # ---------------------------------------------------------------------------
  backup:
    # Image riêng, nhưng vẫn FROM postgres:17 — xem Dockerfile.backup. Ghim đúng
    # tag của service db vì `pg_dump` lệch major với server là nó TỪ CHỐI chạy.
    # Thêm rsync + openssh-client để đẩy bản sao lưu ra khỏi máy này.
    build:
      context: .
      dockerfile: Dockerfile.backup
    restart: unless-stopped
    logging: *logging
    depends_on:
      db:
        condition: service_healthy
    environment:
      DATABASE_URL: postgresql://kidogame:${POSTGRES_PASSWORD}@db:5432/kidogame
      STORAGE_DIR: /srv/storage
      BACKUP_DIR: /backups
      BACKUP_KEEP: ${BACKUP_KEEP:-7}
      BACKUP_HOUR: ${BACKUP_HOUR:-3}
      # Không có dòng này thì container chạy UTC, và BACKUP_HOUR=3 nghĩa là 3 giờ
      # sáng UTC — tức 10 GIỜ SÁNG giờ Việt Nam, đúng quãng trẻ hay chơi. Con số 3
      # đọc lên ai cũng hiểu là 3 giờ sáng, nên phải làm cho nó đúng là 3 giờ sáng.
      TZ: ${TZ:-Asia/Ho_Chi_Minh}
      # Đẩy bản sao lưu sang máy khác. Rỗng = tắt, và mỗi lần chạy sẽ log một dòng
      # nhắc rằng bản sao lưu đang nằm cùng ổ với dữ liệu gốc.
      BACKUP_REMOTE: ${BACKUP_REMOTE:-}
      BACKUP_REMOTE_PORT: ${BACKUP_REMOTE_PORT:-22}
      BACKUP_SSH_KEY: /ssh/id_backup
      BACKUP_SSH_KNOWN_HOSTS: /ssh/known_hosts
    volumes:
      - ./backup.sh:/backup.sh:ro
      # Chỉ đọc: việc của nó là sao chép ra, không bao giờ sửa file game.
      - storage:/srv/storage:ro
      # Bind mount ra host chứ không dùng named volume: bản sao lưu phải nhìn thấy
      # và copy đi được từ ngoài mà không cần lệnh docker nào.
      - ${BACKUP_HOST_DIR:-./backups}:/backups
      # Khoá SSH + known_hosts cho bước đẩy ra ngoài máy. Chỉ đọc, và thư mục này
      # KHÔNG vào image (xem .dockerignore) — nó chứa khoá riêng.
      # Thư mục phải tồn tại kể cả khi chưa dùng tới; ./ssh trong repo có .gitkeep.
      - ./ssh:/ssh:ro
    # Image postgres có entrypoint riêng lo việc khởi tạo cluster, phải ghi đè.
    entrypoint: ['/bin/bash', '/backup.sh', 'loop']

  # ---------------------------------------------------------------------------
  # VIỆC HẰNG ĐÊM: nhắc việc có hạn, xoá hẳn game đã gỡ quá 7 ngày, xoá file thành
  # rác, rồi CANH xem máy chủ còn chạy được bao lâu nữa (đĩa, chứng chỉ, tuổi của
  # bản sao lưu, đợt lỗi mới) và gửi thư nếu có vấn đề.
  #
  # Là một service chứ không phải cron trên host, cùng lý do như `backup`: việc phải
  # có người nhớ chạy thì đúng bằng không có. "Game đã gỡ thì một tuần sau xoá luôn"
  # mà không ai chạy lệnh thì đó không phải một hạn, đó là một câu trong tài liệu.
  #
  # DÙNG LẠI IMAGE CỦA `web`, không build image thứ năm: hai script dọn là tsx +
  # prisma CLI, và image web CỐ Ý giữ devDependencies (xem chú thích trong
  # infra/Dockerfile). `build` trỏ cùng context nên compose không build lại lần hai.
  #
  # PRUNE_HOUR mặc định 4, tức MỘT TIẾNG SAU `BACKUP_HOUR`=3. Thứ tự đó là điều kiện
  # để cửa sổ sửa sai thật sự tồn tại: bản sao lưu của chính ngày xoá vẫn còn chứa
  # game. Đổi hai con số này mà đảo thứ tự thì bản sao lưu gần nhất đã không có game
  # nữa, và "xoá sau 7 ngày" lặng lẽ thành "mất hẳn sau 7 ngày".
  # ---------------------------------------------------------------------------
  prune:
    build:
      context: ..
      dockerfile: infra/Dockerfile
    restart: unless-stopped
    logging: *logging
    depends_on:
      db:
        condition: service_healthy
    environment:
      DATABASE_URL: postgresql://kidogame:${POSTGRES_PASSWORD}@db:5432/kidogame?schema=public
      STORAGE_DIR: /srv/storage
      PRUNE_HOUR: ${PRUNE_HOUR:-4}
      # Hạn giữ game đã gỡ, tính bằng ngày. Rỗng = dùng mặc định 7 trong
      # `NGAY_GIU_GAME_DA_GO`. Đặt 0 hoặc chữ thì script TỪ CHỐI chạy, không xoá gì.
      REMOVED_KEEP_DAYS: ${REMOVED_KEEP_DAYS:-}
      # ĐƯỜNG GỬI MAIL, và service này chưa từng có nó cho tới khi bước nhắc việc
      # được thêm vào prune.sh.
      #
      # Không có nhóm biến này thì `sendMail` ở production NÉM LỖI, nên bước nhắc
      # đỏ trong log mỗi đêm — đó là hướng hỏng đúng. Hướng sai là im lặng: ở dev
      # (NODE_ENV khác production) `sendMail` chỉ in lá thư ra stdout rồi coi như
      # xong, tức thư nhắc "đã gửi" vào log của container và không ai nhận.
      #
      # Cùng danh sách với service `web`, và phải giữ khớp: hai chỗ khai lệch nhau
      # thì app gửi được mail còn thư nhắc thì không, mà cả hai đều báo là ổn.
      SMTP_HOST: ${SMTP_HOST:-}
      SMTP_PORT: ${SMTP_PORT:-587}
      SMTP_USER: ${SMTP_USER:-}
      SMTP_PASS: ${SMTP_PASS:-}
      SMTP_SECURE: ${SMTP_SECURE:-}
      RESEND_API_KEY: ${RESEND_API_KEY:-}
      MAIL_FROM: ${MAIL_FROM:-KidoGame <no-reply@kidogame.vn>}
      # Địa chỉ NHẬN thư nhắc. Chưa khai thì bước nhắc từ chối gửi và nói rõ lý do,
      # thay vì gửi vào `chua-cau-hinh@kidogame.local`.
      OPERATOR_NAME: ${OPERATOR_NAME:-}
      OPERATOR_EMAIL: ${OPERATOR_EMAIL:-}
      # Để link trong thư nhắc bấm được. Rỗng thì thư in đường dẫn trần, không đoán.
      ADMIN_ORIGIN: ${ADMIN_DOMAIN:+https://${ADMIN_DOMAIN}}
      # HAI BIẾN DƯỚI ĐÂY LÀ CỦA BƯỚC CANH (bước 4), không phải của ba bước dọn.
      #
      # Lặp lại `:?` dù cả `web` lẫn `caddy` đã có — cùng lập luận đã ghi ở service
      # `caddy`, và ở đây hệ quả của việc để rỗng còn im hơn: `canh-gac.ts` bỏ qua
      # phép canh nào thiếu origin, nên rỗng ở dòng này KHÔNG làm gì đỏ lên cả. Nó
      # chỉ lặng lẽ gỡ mất phép canh "web có trả lời từ ngoài Internet không" và
      # phép canh chứng chỉ, rồi mỗi đêm báo cáo rằng mọi thứ đều ổn. Một cơ chế
      # giám sát hỏng theo kiểu vẫn nói "ổn" thì tệ hơn hẳn không có cơ chế nào.
      APP_ORIGIN: https://${APP_DOMAIN:?thieu APP_DOMAIN trong infra/.env}
      PLAYER_ORIGIN: https://${PLAYER_DOMAIN:?thieu PLAYER_DOMAIN trong infra/.env}
      # Bước canh đọc thư mục này để biết bản sao lưu mới nhất bao nhiêu tuổi.
      BACKUP_DIR: /backups
      # Ngưỡng báo động, để trống là dùng mặc định trong canh-gac.ts (85 / 26 / 21 / 5).
      CANH_DIA_PHAN_TRAM: ${CANH_DIA_PHAN_TRAM:-}
      CANH_SAO_LUU_GIO: ${CANH_SAO_LUU_GIO:-}
      CANH_CHUNG_CHI_NGAY: ${CANH_CHUNG_CHI_NGAY:-}
      CANH_LOI_MOI: ${CANH_LOI_MOI:-}
      # Cùng lý do như service backup: thiếu dòng này thì container chạy UTC và
      # PRUNE_HOUR=4 nghĩa là 11 giờ trưa giờ Việt Nam. Ở đây còn một hệ quả nữa:
      # hạn SLA đếm theo ngày làm việc, nên lệch múi giờ đổi cả kết quả đếm.
      TZ: ${TZ:-Asia/Ho_Chi_Minh}
    volumes:
      - ./prune.sh:/prune.sh:ro
      # ĐỌC-GHI, khác service backup: việc của nó là xoá file, không phải sao chép.
      - storage:/srv/storage
      # CHỈ ĐỌC, cho bước canh (bước 4): nó chỉ hỏi bản sao lưu mới nhất bao nhiêu
      # tuổi và nặng bao nhiêu. Cùng thư mục host mà service `backup` ghi vào, nên
      # `BACKUP_HOST_DIR` phải khớp giữa hai chỗ — lệch thì bước canh nhìn vào một
      # thư mục rỗng và báo "chưa từng sao lưu thành công" mỗi đêm, trong khi việc
      # sao lưu vẫn đang chạy đúng ở thư mục kia.
      #
      # Mount ĐỌC-GHI thì service này xoá được bản sao lưu, mà nó là service duy
      # nhất trong stack có công việc chính là xoá thứ gì đó. Không cho nó cầm cả
      # hai quyền cùng lúc.
      - ${BACKUP_HOST_DIR:-./backups}:/backups:ro
    entrypoint: ['/bin/bash', '/prune.sh', 'loop']

  # ---------------------------------------------------------------------------
  # Umami — đếm lượt xem, TỰ HOST. Thay cho Mixpanel / Google Analytics.
  #
  # Vì sao tự host chứ không dùng dịch vụ: đây là web cho trẻ em. Script bên thứ
  # ba chạy trong trình duyệt của bé và gửi IP ra máy chủ nước ngoài là đi ngược
  # cả CSP `connect-src 'self'` lẫn Nghị định 13/2023 — xem infra/GIAM-SAT.md.
  # Umami không đặt cookie và không lưu IP (chỉ băm kèm muối xoay vòng).
  #
  # Trình duyệt KHÔNG nói chuyện thẳng với container này. Trên app domain, Caddy
  # chỉ mở đúng hai đường — `/_stats/script.js` và `/_stats/api/send` — nên với
  # trình duyệt đó vẫn là 'self'. Dashboard nằm ở STATS_DOMAIN riêng.
  #
  # DB riêng (`umami`), user riêng, trong CÙNG container Postgres: user `umami`
  # không đọc được bảng nào của KidoGame. Tạo một lần bằng `infra/tao-db-umami.sh`.
  #
  # KHÔNG nằm trong bản sao lưu (backup.sh chỉ dump DB `kidogame`). Mất VPS thì mất
  # lịch sử lượt xem — chấp nhận: đó là số liệu, không phải dữ liệu của bé.
  #
  # Ghim phiên bản, không `latest`: build lại không được tự nhảy lên bản mới có
  # migration DB mà chưa ai đọc release note.
  # ---------------------------------------------------------------------------
  umami:
    image: ghcr.io/umami-software/umami:3.3.1
    restart: unless-stopped
    logging: *logging
    depends_on:
      db:
        condition: service_healthy
    environment:
      DATABASE_URL: postgresql://umami:${UMAMI_DB_PASSWORD:?thieu UMAMI_DB_PASSWORD trong infra/.env}@db:5432/umami
      APP_SECRET: ${UMAMI_APP_SECRET:?thieu UMAMI_APP_SECRET trong infra/.env}
      # Caddy đứng trước, nên IP thật nằm trong header này. Umami chỉ dùng nó để
      # đoán quốc gia và băm vào mã phiên, không lưu.
      CLIENT_IP_HEADER: x-forwarded-for
      DISABLE_TELEMETRY: '1'
      DISABLE_UPDATES: '1'
      TZ: ${TZ:-Asia/Ho_Chi_Minh}

volumes:
  # Hai volume dưới đây là TOÀN BỘ dữ liệu không sinh lại được. Sao lưu nghĩa là
  # sao lưu đúng hai cái này.
  pgdata:
  storage:
  caddy_data:
  caddy_config:
